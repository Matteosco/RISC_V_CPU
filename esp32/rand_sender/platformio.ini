; ESP32-S3 -> FPGA random number sender
;   pio run -t upload      (or the PlatformIO "Upload" button in VS Code)
;   pio device monitor     (shows what is being sent, 115200 baud)
;
; Two boards are defined; PlatformIO builds the first one unless you pick
; another (VS Code: environment selector in the status bar, or -e NAME).

; Adafruit Feather ESP32-S3 No PSRAM (the board used in the lab)
;   data pin GPIO17 is the pin labelled "A1" on the Feather
[env:feather_s3]
platform      = espressif32
board         = adafruit_feather_esp32s3_nopsram
framework     = arduino
monitor_speed = 115200
; the board definition asks for an Adafruit TinyUF2 partition table that the
; platform does not ship: use the standard 8 MB table instead
board_build.partitions = default_8MB.csv

; Espressif ESP32-S3-DevKitC-1 (GPIO17 is labelled "17")
[env:esp32-s3]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200

; continuous stream (no pause between numbers): a byte every 87 us, for ILA
; captures where the UART interrupts arrive next to the others
;   pio run -e feather_s3_fast -t upload
[env:feather_s3_fast]
extends     = env:feather_s3
build_flags = -DPERIOD_MS=0

[env:esp32-s3_fast]
extends     = env:esp32-s3
build_flags = -DPERIOD_MS=0
